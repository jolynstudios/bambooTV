<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="bambooTV">
  <!-- The bambooTV mark: a hotend sits on a TV and prints its picture.
       Gold filament goes in on top (the "antenna"), gold layer lines come out
       on screen; layer lines double as scan lines. -->
  <defs>
    <mask id="gap">
      <rect width="80" height="84" fill="#fff"/>
      <rect x="29.5" y="7" width="25" height="16" rx="4" fill="#000"/>
    </mask>
  </defs>
  <rect width="120" height="120" rx="26" fill="#0D0E10"/>
  <g transform="translate(20 18)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="4" y="16" width="72" height="52" rx="12" stroke="#EFEAE1" stroke-width="5" mask="url(#gap)"/>
    <path d="M28 78H52" stroke="#EFEAE1" stroke-width="5"/>
    <path d="M14 58.5H66" stroke="#B66A3A" stroke-width="6.2"/>
    <path d="M14 49H66" stroke="#C8843F" stroke-width="6.2"/>
    <path d="M14 39.5H66" stroke="#D69C49" stroke-width="6.2"/>
    <path d="M14 30H42" stroke="#E4B45B" stroke-width="6.2"/>
    <path d="M42 2V11" stroke="#E4B45B" stroke-width="3.6"/>
    <g fill="#EFEAE1" stroke="none">
      <rect x="33" y="10" width="18" height="10" rx="2.5"/>
      <path d="M36.5 20h11l-3.6 6h-3.8z"/>
    </g>
  </g>
</svg>

# bambooTV radio (optional background music).
#
# Loaded as a second go2rtc config file: it redefines the "tv" stream (what the
# TV page and DLNA play) as the camera plus the station's audio, transcoded to
# AAC by ffmpeg. go2rtc only starts the radio while someone watches, and the
# picture keeps playing when the station is unreachable. RTSP apps keep the
# plain camera stream "x2d".
#
# Switch: `sudo ./install.sh --radio on|off` (systemd) copies this file to
# /opt/bambu-tv/radio.yaml or removes it. Docker: see compose.yaml.
# The station comes from RADIO_URL in bambu-tv.env.
streams:
  tv:
    - rtsp://127.0.0.1:${RTSP_PORT:8554}/x2d
    - ffmpeg:${RADIO_URL}#audio=aac

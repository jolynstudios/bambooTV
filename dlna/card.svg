<svg xmlns="http://www.w3.org/2000/svg" width="520" height="250" viewBox="0 0 520 250">
  <!-- bambooTV print card, burned into the DLNA picture. Static background:
       rounded panel + the mark. All text is drawn at runtime by ffmpeg
       (drawtext), reading /run/bambu-tv/card-*.txt so it stays live. -->
  <rect x="1" y="1" width="518" height="248" rx="26" fill="#0D0E10" fill-opacity="0.62"
        stroke="#EFEAE1" stroke-opacity="0.14" stroke-width="2"/>
  <!-- The mark: hotend on a TV, layer lines partly printed (as mid-print). -->
  <g transform="translate(28 74) scale(0.82)">
    <g transform="translate(20 18)" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="16" width="72" height="52" rx="12" stroke="#EFEAE1" stroke-width="5"/>
      <path d="M28 78H52" stroke="#EFEAE1" stroke-width="5"/>
      <path d="M14 58.5H66" stroke="#B66A3A" stroke-width="6.2"/>
      <path d="M14 49H66" stroke="#C8843F" stroke-width="6.2"/>
      <path d="M14 39.5H66" stroke="#D69C49" stroke-width="6.2"/>
      <path d="M14 30H42" stroke="#E4B45B" stroke-width="6.2"/>
      <path d="M42 2V11" stroke="#E4B45B" stroke-width="3.6"/>
      <g fill="#EFEAE1" stroke="none">
        <rect x="33" y="10" width="18" height="10" rx="2.5"/>
        <path d="M36.5 20h11l-3.6 6h-3.8z"/>
      </g>
    </g>
  </g>
</svg>
